# Production nginx for Hellogram (one server, Docker Compose). docs/RUNBOOKS.md §1.
#   hellogram.in        landing page      (/srv/site)
#   app.hellogram.in    web app + API     (/srv/web, api:4000)
#   admin.hellogram.in  admin panel       (/srv/admin, admin-api:4100, IP allowlist)
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  # Request log without query strings (they can carry codes or ids).
  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # WebSocket upgrade for Socket.IO.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  include /etc/nginx/snippets/cloudflare-realip.conf;
  include /etc/nginx/conf.d/*.conf;
}
