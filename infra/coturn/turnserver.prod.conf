# Production TURN relay (relay-only calls; docs/ARCHITECTURE.md §9).
# Runs with host networking. Replace EXTERNAL_IP and the secret (TURN_SHARED_SECRET in the API).
listening-port=3478
# TURN over TLS for restrictive networks. 443 is taken by Caddy on a single-IP server,
# so TLS listens on 5349; move it to 443 on a second IP if needed.
tls-listening-port=5349
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
external-ip=EXTERNAL_IP
min-port=49152
max-port=65535
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TO_TURN_SHARED_SECRET
realm=hellogram.app
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12
total-quota=1200
# Never relay into private networks (SSRF protection).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
