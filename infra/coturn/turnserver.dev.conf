# Development TURN server (Docker). Production uses Cloudflare's TURN service instead
# (CLOUDFLARE_TURN_* in infra/.env.production).
listening-port=3478
min-port=49160
max-port=49200
fingerprint
use-auth-secret
static-auth-secret=dev-turn-secret-change-me
realm=hellogram.local
no-multicast-peers
no-cli
# In dev both browsers relay through this one container, so relay-to-relay
# traffic stays on Docker's private network and must be allowed here.
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=127.0.0.1
log-file=stdout
