# Native (Homebrew) coturn for local development when Docker can't pull the image:
#   turnserver -c infra/coturn/turnserver.local.conf
# Loopback only: both browsers and the relay live on this machine.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=49160
max-port=49200
fingerprint
use-auth-secret
static-auth-secret=dev-turn-secret-change-me
realm=hellogram.local
no-multicast-peers
no-cli
no-tls
no-dtls
allow-loopback-peers
allowed-peer-ip=127.0.0.1
log-file=stdout
simple-log
