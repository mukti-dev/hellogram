# Local development services. Start with `pnpm db:up`.
name: hellogram

services:
  postgres:
    image: postgres:16-alpine
    # Come back by themselves when Docker Desktop starts (otherwise `pnpm dev` can't connect).
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellogram
      POSTGRES_PASSWORD: hellogram
      POSTGRES_DB: hellogram
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellogram"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ queues must never lose keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Voice relay (relay-only calls, see docs/ARCHITECTURE.md §9). Used from Phase 8.
  coturn:
    image: coturn/coturn:4.18-alpine
    profiles: ["calls"]
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.dev.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres-data:
  redis-data:
