# Single-server production (AWS Lightsail, Ubuntu 24.04). docs/RUNBOOKS.md → "Deploy".
# Runs ready-made images from GitHub's registry (built by .github/workflows/ci.yml); the server never builds.
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production pull
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d
# To build the images on a machine instead, add  -f infra/docker-compose.build.yml  (see that file).
name: hellogram-prod

x-app: &app
  restart: unless-stopped
  env_file: .env.production
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # hellogram.in (landing) · app.hellogram.in (web app + API) · admin.hellogram.in (admin panel).
  nginx:
    image: ${IMAGE_REGISTRY}/nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Only the domain names — the web server never needs the app's secrets.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./nginx/admin-allowlist.conf:/etc/nginx/admin-allowlist.conf:ro
    # Pick up renewed certificates without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on: [api, admin-api]

  # Renews the Let's Encrypt certificate (first one: infra/nginx/init-certs.sh).
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./nginx/certbot-hooks:/hooks:ro
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'sh /hooks/copy-for-coturn.sh' --quiet; sleep 12h & wait $${!}; done"

  api:
    <<: *app
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG:-latest}
    environment: { MEDIA_DIR: /data/media, HOST: 0.0.0.0 }
    volumes: [media:/data/media]

  worker:
    <<: *app
    image: ${IMAGE_REGISTRY}/worker:${IMAGE_TAG:-latest}

  admin-api:
    <<: *app
    image: ${IMAGE_REGISTRY}/admin-api:${IMAGE_TAG:-latest}
    environment: { HOST: 0.0.0.0 }

  migrate:
    image: ${IMAGE_REGISTRY}/migrate:${IMAGE_TAG:-latest}
    env_file: .env.production
    depends_on: { postgres: { condition: service_healthy } }
    profiles: [tools]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellogram
      POSTGRES_DB: hellogram
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hellogram"], interval: 10s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10 }

  coturn:
    image: coturn/coturn:4.18-alpine
    restart: unless-stopped
    network_mode: host
    # Server-specific values come from .env.production, so the config file needs no edits.
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${TURN_EXTERNAL_IP}
      # Relay only on the server's own network address. Left to itself, coturn also relays on Docker's
      # bridges (172.17/172.18) and IPv6, which the other side can't reach — calls then break up or drop.
      - --relay-ip=${TURN_RELAY_IP:?set TURN_RELAY_IP (the server's private IP) in infra/.env.production}
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=${SITE_DOMAIN}
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
      - letsencrypt:/etc/letsencrypt:ro

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres-data:
  redis-data:
  media:
  letsencrypt:
  certbot-www:
