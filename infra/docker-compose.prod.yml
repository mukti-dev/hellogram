# Single-server production (e.g. AWS Lightsail 4 GB, Mumbai). docs/RUNBOOKS.md → "Deploy".
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d --build
name: hellogram-prod

x-app: &app
  restart: unless-stopped
  env_file: .env.production
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # hellogram.in (landing) · app.hellogram.in (web app + API) · admin.hellogram.in (admin panel).
  nginx:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: nginx
      args:
        VITE_APP_URL: https://${APP_DOMAIN}
        VITE_PHONE_AUTH: ${VITE_PHONE_AUTH:-otp}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    # Only the domain names — the web server never needs the app's secrets.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./nginx/admin-allowlist.conf:/etc/nginx/admin-allowlist.conf:ro
    # Pick up renewed certificates without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on: [api, admin-api]

  # Renews the Let's Encrypt certificate (first one: infra/nginx/init-certs.sh).
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./nginx/certbot-hooks:/hooks:ro
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'sh /hooks/copy-for-coturn.sh' --quiet; sleep 12h & wait $${!}; done"

  api:
    <<: *app
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: api }
    environment: { MEDIA_DIR: /data/media, HOST: 0.0.0.0 }
    volumes: [media:/data/media]

  worker:
    <<: *app
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: worker }

  admin-api:
    <<: *app
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: admin-api }
    environment: { HOST: 0.0.0.0 }

  migrate:
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: migrate }
    env_file: .env.production
    depends_on: { postgres: { condition: service_healthy } }
    profiles: [tools]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellogram
      POSTGRES_DB: hellogram
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hellogram"], interval: 10s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10 }

  coturn:
    image: coturn/coturn:4.18-alpine
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
      - letsencrypt:/etc/letsencrypt:ro

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres-data:
  redis-data:
  media:
  letsencrypt:
  certbot-www:
