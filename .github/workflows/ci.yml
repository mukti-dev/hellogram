name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hellogram, POSTGRES_PASSWORD: hellogram, POSTGRES_DB: hellogram }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hellogram" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @hellogram/api test:int
      - run: pnpm --filter @hellogram/admin-api test:int

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hellogram, POSTGRES_PASSWORD: hellogram, POSTGRES_DB: hellogram }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hellogram" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: pnpm db:generate && pnpm --filter @hellogram/db migrate:deploy
        env: { DATABASE_URL: 'postgresql://hellogram:hellogram@localhost:5433/hellogram' }
      - name: Prepare env files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/worker/.env.example apps/worker/.env
          sed -i 's|^TURN_URLS=.*|TURN_URLS=turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp|' apps/api/.env
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: apps/web
      - name: Start TURN, API and web
        run: |
          turnserver -c infra/coturn/turnserver.local.conf &
          pnpm --filter @hellogram/api dev &
          pnpm --filter @hellogram/web dev &
          npx --yes wait-on http://localhost:4000/health/live http://localhost:5173
      - run: pnpm --filter @hellogram/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      - name: Docker images build
        run: |
          for target in api worker admin-api caddy migrate; do
            docker build -f infra/docker/Dockerfile --target $target -t hellogram-$target:ci .
          done
