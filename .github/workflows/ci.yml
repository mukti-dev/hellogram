name: CI/CD

# Every pull request and every push to main: lint, typecheck, unit, integration and browser tests,
# and a build of all production images. On main, the images are pushed to GitHub's registry
# (ghcr.io/<owner>/hellogram/*) and deployed to the Lightsail server (deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes to a pull request replace older runs; runs on main always finish (they deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hellogram, POSTGRES_PASSWORD: hellogram, POSTGRES_DB: hellogram }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hellogram" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @hellogram/api test:int
      - run: pnpm --filter @hellogram/admin-api test:int

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hellogram, POSTGRES_PASSWORD: hellogram, POSTGRES_DB: hellogram }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U hellogram" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Ubuntu starts its own coturn (default settings, no shared secret) on port 3478 as soon as it is
      # installed: stop it, or the browsers reach that one, get refused, and calls never connect.
      - name: Install coturn
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q coturn
          sudo systemctl disable --now coturn || true
      - run: pnpm db:generate && pnpm --filter @hellogram/db migrate:deploy
        env: { DATABASE_URL: 'postgresql://hellogram:hellogram@localhost:5433/hellogram' }
      # The example settings are test-safe: codes are printed, never sent (the tests refuse otherwise).
      - name: Prepare env files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/worker/.env.example apps/worker/.env
          sed -i 's|^TURN_URLS=.*|TURN_URLS=turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp|' apps/api/.env
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: apps/web
      - name: Start TURN, API and web
        run: |
          turnserver -c infra/coturn/turnserver.local.conf > turn.log 2>&1 &
          # Fail here, with the relay's log, if it could not start (rather than as a call timeout later).
          for i in $(seq 1 20); do ss -lntu | grep -q '127.0.0.1:3478' && break; sleep 0.5; done
          ss -lntu | grep -q '127.0.0.1:3478' || { cat turn.log; echo '::error::TURN relay did not start'; exit 1; }
          pnpm --filter @hellogram/api dev > api.log 2>&1 &
          pnpm --filter @hellogram/web dev > web.log 2>&1 &
          npx --yes wait-on --timeout 120000 http://localhost:4000/health/live http://localhost:5173
      - run: pnpm --filter @hellogram/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/test-results
            api.log
            web.log
            turn.log

  images:
    name: Docker images
    needs: [quality, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pull requests only check the images build; main pushes them for deployment.
      - uses: docker/bake-action@v6
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_APP_URL: https://${{ vars.APP_DOMAIN || 'app.hellogram.in' }}
          VITE_PHONE_AUTH: ${{ vars.VITE_PHONE_AUTH || 'otp' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        with:
          source: .
          files: infra/docker/docker-bake.hcl
          push: ${{ steps.meta.outputs.push == 'true' }}
          set: |
            *.cache-from=type=gha,scope=hellogram
            *.cache-to=type=gha,mode=max,scope=hellogram

  deploy:
    name: Deploy
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.images.outputs.push == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.images.outputs.tag }}
    secrets: inherit
